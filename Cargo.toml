[package]
name = "atsassin"
version = "0.1.0"
edition = "2021"
authors = ["ATSassin Contributors"]
license = "MIT"
description = "The silent killer of bad job matches. A lightweight, privacy-first, local-first job search assassin."
repository = "https://github.com/Celerio-sg/ATSassin"
keywords = ["job-search", "resume", "ats", "ollama", "local-first", "privacy", "career", "open-source", "local-ai"]
categories = ["command-line-utilities", "text-processing"]

[lib]
name = "atsassin"
path = "src/lib.rs"

[[bin]]
name = "atsassin"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Async runtime
tokio = { version = "1.45", features = ["full"] }

# HTTP / LLM client
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "blocking", "multipart"] }

# HTML parsing
scraper = "0.27"
# Headless browser fallback
fantoccini = "0.19"
# PDF
printpdf = { version = "0.7", features = ["image"] }

# TUI
ratatui = "0.29"
crossterm = "0.28"
sysinfo = "0.39"

# Database
rusqlite = { version = "0.40", features = ["backup", "bundled", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }

# Text processing
tokenizers = "0.23"
regex = "1.11"
uuid = { version = "1.11", features = ["v4", "serde"] }
lazy_static = "1.5"

# Error handling
anyhow = "1.0"
thiserror = "2.0"
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config
config = "0.15"
dotenv = "0.15"

# Utilities
base64 = "0.23"
url = "2.5"
urlencoding = "2.1"
zip = "8.6"
csv = "1.3"

# Outcome ingestion (Phase 0)
imap = "2.4"
mailparse = "0.14"
keyring = "2.3"
native-tls = "0.2"

# Telemetry compression (Phase 2)
zstd = "0.13"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.14"
assert_cmd = "2.0"
predicates = "3.1"
portable-pty = "0.9"
vt100 = "0.15"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
